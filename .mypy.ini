[mypy]
check_untyped_defs = True
follow_imports = silent

# Per-module settings are better than a global ignore_missing_imports
[mypy-gi.*]
ignore_missing_imports = True

[mypy-pyqtgraph.*]
ignore_missing_imports = True

[mypy-requests_futures.*]
ignore_missing_imports = True

# Don't insist on every container variable everywhere being annotated
[mypy-pytopo.*]
disable_error_code = var-annotated

# for things like TiledMapWindow complaining about MapWindow not having
# functions that will be defined in derived classes.
# An alternative to typing self.mapwin as Any.
# [mypy-pytopo.somefile]
# disable_error_code = attr-defined
